<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Amigo Pet</title>
    <link rel="stylesheet" href="estilo.css">

</head>
<body>
     <header>
    <h1>Clínica Veterinária Amigo Pet</h1>
    </header>

    <main>
        <section class="cartao">
      <h2>Agendamento de Consulta</h2>
      <div class="area-imagem">
      
        <img 
          src="Imagens/cachorro.jpg"
          alt="Dois cachorros um caramelo com as patas brancas e pescoço branco e 
          o outro um fiapo de manga, peludo caramelo com o pescoço cinza, ambos 
          porte medio correndo lado a lado"
          class="foto-destaque"
        >
        <p>Cuide da saúde do seu melhor amigo com carinho!</p>

        <form>
        <h3>Formulário de Cadastro ou Pedido</h3>
        <p>
        <label for="nome-tutor">Nome do Tutor:</label>
        <input type="text" id="nome-tutor" minlength="3" required aria-describedby="ajuda-nome-tutor">
        <small id="ajuda-nome-tutor">Digite o nome completo do responsável.</small>
        </p>
        <label for="email-usuario">E-mail para Contato:</label>
        <input type="email" id="email-usuario" name="email-usuario" required>
        </p>

        <fieldset>

        <legend>Espécie do Animal:</legend>

        <input type="radio" id="cachorro" name="animal" value="cachorro">
        <label for="cachorro">Cachorro</label><br>

        <input type="radio" id="gato" name="animal" value="gato">
        <label for="gato">Gato</label><br>

        </fieldset>

        <fieldset>
        <legend>Serviços Desejados</legend>

         <input type="checkbox" id="vacinacao" name="servicos" value="vacinacao">
         <label for="vacinacao">Vacinação</label><br>

        <input type="checkbox" id="banho" name="servicos" value="banho">
        <label for="banho">Banho e Tosa</label><br>

        </fieldset>

        <button type="submit">Agendar Consulta</button>   
        </form>
       </section>
       </main>
      <footer>
      <p>Clínica Amigo Pet - Atendimento Acessível 2026</p>
      </footer>

</body>

</html>
